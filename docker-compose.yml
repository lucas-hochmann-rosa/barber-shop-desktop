services:
  mysql:
    image: mysql:8.0
    container_name: barbershop-mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: barbershop
    ports:
      - "3306:3306"
    volumes:
      - barbershop-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  barbershop-mysql-data:
