<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minha barbearia &middot; BarberDesk</title>
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/componentes.css">
    <link rel="stylesheet" href="css/paginas.css">
</head>
<body>

    <a class="pular-para-conteudo" href="#conteudo">Pular para o conteúdo</a>

    <div class="aplicacao">

        <!-- ================= BARRA LATERAL ================= -->
        <header class="barra-lateral" id="barraLateral">
            <div class="barra-lateral__marca">
                <img class="barra-lateral__logo" src="img/logo.svg" width="40" height="40" alt="">
                <div>
                    <div class="barra-lateral__nome">BarberDesk</div>
                    <div class="barra-lateral__barbearia">Barbearia do Lucas</div>
                </div>
            </div>

            <nav class="barra-lateral__nav" aria-label="Navegação principal">
                <ul>
                    <li>
                        <a class="barra-lateral__link" href="agenda.html">
                            <svg class="barra-lateral__icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                            Agenda
                        </a>
                    </li>
                    <li>
                        <a class="barra-lateral__link" href="agendamento.html">
                            <svg class="barra-lateral__icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M12 11v7M8.5 14.5h7"/></svg>
                            Novo agendamento
                        </a>
                    </li>
                    <li>
                        <a class="barra-lateral__link" href="barbearia.html">
                            <svg class="barra-lateral__icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9Z"/><path d="M4 9 6 3h12l2 6"/><path d="M10 21v-6h4v6"/></svg>
                            Minha barbearia
                        </a>
                    </li>
                    <li>
                        <a class="barra-lateral__link" href="historico.html">
                            <svg class="barra-lateral__icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
                            Histórico
                        </a>
                    </li>
                    <li>
                        <a class="barra-lateral__link" href="relatorios.html">
                            <svg class="barra-lateral__icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16"/><rect x="6" y="11" width="3.5" height="7"/><rect x="13" y="6" width="3.5" height="12"/></svg>
                            Relatórios
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="barra-lateral__rodape">
                <a class="barra-lateral__sair" href="index.html" data-sair>Sair</a>
            </div>
        </header>

        <div class="conteudo">

            <!-- ================= TOPO ================= -->
            <div class="topo">
                <button class="topo__menu" type="button" data-abrir-menu
                        aria-expanded="false" aria-controls="barraLateral" aria-label="Abrir menu">
                    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                </button>

                <h1 class="topo__titulo">Minha barbearia</h1>
                <span class="topo__data" data-data-hoje></span>
                <span class="topo__avatar" title="Lucas Rosa">LR</span>
            </div>

            <!-- ================= CONTEÚDO ================= -->
            <main class="pagina" id="conteudo">
                <p class="texto-secundario">Conteúdo de Minha barbearia em construção (Passo 3).</p>
            </main>

        </div>
    </div>

    <script src="js/app.js"></script>

</html>
